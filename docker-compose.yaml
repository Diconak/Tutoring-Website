services:
  backend:
    container_name: backend
    build: ./Backend
    ports:
      - "3000:3000"
    volumes:
      - .:/Backend/app/
      - /app/node_modules
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data


volumes:
  postgres-data:
